[manifest]
version = "0.1.0"
name = "cyber-pilot-kit-frontx"
description = "FrontX AI Tooling Kit — ecosystem-level AI capabilities for Cypilot agents"

[[resources]]
id = "frontx_skill"
source = "SKILL.md"
default_path = "SKILL.md"
type = "file"
user_modifiable = false

[[resources]]
id = "frontx_agents"
source = "AGENTS.md"
default_path = "AGENTS.md"
type = "file"
user_modifiable = false

[[resources]]
id = "frontx_guidelines"
source = "guidelines/"
default_path = "guidelines/"
type = "directory"
user_modifiable = false
